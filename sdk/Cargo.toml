[package]
name = "vk-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"
autobins = false

# Independent development workspace: none of these dependencies enter vkrust.
[workspace]
resolver = "3"

[features]
default = []
ash-reference = ["dep:ash"]
vulkano-reference = ["dep:vulkano"]
triangle = []

[dependencies]
vk = { package = "vkrust", path = "..", features = ["allocator"] }
ash = { version = "=0.38.0", optional = true, default-features = false, features = ["loaded", "std"] }
vulkano = { version = "=0.35.2", optional = true, default-features = false }
serde_json = "=1.0.145"

[[bin]]
name = "vk-bench"
path = "src/rs/vk.rs"

[[bin]]
name = "ash-bench"
path = "src/rs/ash.rs"
required-features = ["ash-reference"]

[[bin]]
name = "vulkano-bench"
path = "src/rs/vulkano.rs"
required-features = ["vulkano-reference"]

[[bin]]
name = "vk-triangle"
path = "src/rs/triangle.rs"
required-features = ["triangle"]

[profile.release]
opt-level = 3
debug = 0
incremental = false
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false
